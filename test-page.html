<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Pattern Test Page</title>
    <style>
        body { font-family: sans-serif; padding: 40px; max-width: 600px; margin: auto; }
        .checkout-box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        .hidden-cancel { font-size: 8px; color: white; opacity: 0.1; text-decoration: none; display: block; margin-top: 20px;}
        .confirmshaming { margin-top: 15px; display: block; color: #666; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0;}
        .primary-btn { background: #27ae60; color: white; padding: 10px 20px; border: none; font-size: 18px; cursor: pointer; width: 100%; border-radius: 5px; margin-top: 15px;}
    </style>
</head>
<body>
    <h1>Complete Your Order</h1>
    <p>Please review your subscription details below.</p>
    
    <div class="checkout-box">
        <h3>Premium Plan: $99/year</h3>
        
        <!-- Dark Pattern 1: Pre-checked box -->
        <label>
            <input type="checkbox" checked id="sneaky-checkbox">
            I agree to subscribe to the daily promotional newsletter and partner offers.
        </label>

        <button class="primary-btn">Complete Purchase</button>

        <!-- Dark Pattern 2: Confirmshaming -->
        <button class="confirmshaming">No thanks, I hate saving money</button>
        
        <!-- Dark Pattern 3: Hidden button -->
        <a href="#" class="hidden-cancel">Cancel Subscription</a>
    </div>
</body>
</html>
