<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPlus Checkout</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .checkout-container {
            background: white;
            width: 450px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 24px;
        }
        .price-box {
            background: #e3f2fd;
            border: 2px solid #2196F3;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
        }
        .price-box h2 { margin: 0 0 5px 0; color: #1565C0; }
        .urgency-badge {
            color: #d32f2f;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .checkbox-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .checkbox-group input { margin-top: 3px; }
        .checkout-btn {
            background: #2196F3;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(33, 150, 243, 0.3);
        }
        .checkout-btn:hover { background: #1976D2; }
        .shame-btn {
            background: none;
            border: none;
            color: #999;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
            text-decoration: underline;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
        }
        .tiny-cancel {
            font-size: 8px;
            color: #f0f2f5; /* Invisible against background */
            opacity: 0.1;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h1>Complete your subscription</h1>
        <p style="color: #666; margin-bottom: 25px;">You are one step away from unlimited streaming.</p>

        <div class="price-box">
            <h2>StreamPlus Premium</h2>
            <p style="margin:0; font-size: 24px; font-weight: bold;">$14.99 <span style="font-size: 14px; font-weight: normal;">/ month</span></p>
            
            <!-- Dark Pattern 1: Fake Scarcity -->
            <div class="urgency-badge">🔥 Hurry! Limited time offer ends in 14:59</div>
        </div>

        <!-- Dark Pattern 2: Pre-checked box -->
        <div class="form-group checkbox-group">
            <input type="checkbox" checked id="marketing-spam">
            <label for="marketing-spam">I agree to subscribe to marketing emails, partner offers, and auto-renew my plan indefinitely.</label>
        </div>

        <button class="checkout-btn">Start My Subscription</button>

        <!-- Dark Pattern 3: Confirmshaming -->
        <button class="shame-btn">No thanks, I prefer to lose access to great shows.</button>
        
        <!-- Dark Pattern AI Test: A unique guilt trip that standard regex will miss! -->
        <p style="font-size: 11px; color: #7f8c8d; text-align: center; margin-top: 20px;">
           If you do not sign up today, you will be letting your family down by not providing them with adequate entertainment.
        </p>
        
        <!-- Dark Pattern 4: Hidden button -->
        <div class="footer">
            <a href="#" class="tiny-cancel">Cancel Subscription</a>
        </div>
    </div>

</body>
</html>
